[package]
name = "contratto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime for traits generated by protoc-gen-contratto-rust: Status, Code, boxed futures, iterators, and streams"
readme = "../../README.md"

[features]
# `Offload` and `Blocking`: bridges between the sync and async forms.
tokio = ["dep:tokio"]

[dependencies]
buffa-types = { workspace = true }
futures-core = { workspace = true }
tokio = { workspace = true, optional = true, features = [
    "rt",
    "rt-multi-thread",
    "sync",
] }

[lints]
workspace = true
