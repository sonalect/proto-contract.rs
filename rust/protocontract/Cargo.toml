[package]
name = "protocontract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Runtime for traits generated by protoc-gen-protocontract-buffa: Error, error codes, boxed futures, iterators, and streams"
readme = "../../README.md"
keywords = ["protobuf", "buffa", "traits", "async", "error"]
categories = ["asynchronous", "rust-patterns"]
exclude = ["BUILD.bazel"]

# docs.rs shows the `tokio`-gated bridges too.
[package.metadata.docs.rs]
all-features = true

[features]
# `Offload` and `Blocking`: bridges between the sync and async forms.
tokio = ["dep:tokio"]

[dependencies]
buffa = { workspace = true }
futures-core = { workspace = true }
tokio = { workspace = true, optional = true, features = [
    "rt",
    "rt-multi-thread",
    "sync",
] }

[lints]
workspace = true
