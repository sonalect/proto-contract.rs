[package]
name = "protoc-gen-protocontract-buffa"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "protoc plugin: plain Rust sync and async traits for protobuf services, over buffa message types"
readme = "../../README.md"

[lib]
name = "protoc_gen_protocontract_buffa"
path = "src/lib.rs"

[[bin]]
name = "protoc-gen-protocontract-buffa"
path = "src/main.rs"

[dependencies]
buffa = { workspace = true }
buffa-codegen = { workspace = true }
heck = { workspace = true }
prettyplease = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true }

[lints]
workspace = true
