# Golden generate for the test protos (`bazel run //proto:generate`).
# buffa writes the messages, connect-rust its service items, and Contratto
# both layouts of its traits. rust/golden mounts buffa's and Contratto's
# output as separate trees, and all three once into one module per package.
# The `file_per_package` run also gates its bridges (`gate_tokio_feature`)
# and names the runtime through a re-export (`runtime=crate::rt`).
# `extern_path` maps one package away from `buffa_module` so the golden
# output also covers a path that does not follow the proto package.
version: v2
inputs:
  - directory: proto
plugins:
  - local: protoc-gen-buffa
    out: rust/golden/src/generated/buffa
    strategy: all
  - local: protoc-gen-buffa-packaging
    out: rust/golden/src/generated/buffa
    strategy: all
  - local: protoc-gen-contratto-rust
    out: rust/golden/src/generated/contratto
    strategy: all
    opt:
      - buffa_module=crate::proto
      - extern_path=.example.shared=crate::shared
  - local: protoc-gen-buffa-packaging
    out: rust/golden/src/generated/contratto
    strategy: all
    opt:
      - filter=services
  - local: protoc-gen-contratto-rust
    out: rust/golden/src/generated/per_package
    strategy: all
    opt:
      - buffa_module=crate::proto
      - extern_path=.example.shared=crate::shared
      - file_per_package
      - gate_tokio_feature
      - runtime=crate::rt
  - local: protoc-gen-connect-rust
    out: rust/golden/src/generated/connect
    strategy: all
    opt:
      - buffa_module=crate::proto
      - extern_path=.example.shared=crate::shared
      - gate_client_feature
