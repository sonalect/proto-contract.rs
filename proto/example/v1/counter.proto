edition = "2023";

package example.v1;

// Keeps a running total.
service CounterService {
  // Add a number to the total and return the new total.
  rpc Add(AddRequest) returns (AddReply);
}

// A number to add.
message AddRequest {
  // The amount to add; may be negative.
  int64 delta = 1;
}

// The total after an addition.
message AddReply {
  // The new total.
  int64 total = 1;
}
