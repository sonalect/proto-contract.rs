edition = "2023";

package example.v1;

// Keeps a running total.
service Counter {
  // Add a number to the total and return the new total.
  rpc Add(Delta) returns (Total);
}

// A number to add.
message Delta {
  // The amount to add; may be negative.
  int64 value = 1;
}

// The total after an addition.
message Total {
  // The new total.
  int64 value = 1;
}
