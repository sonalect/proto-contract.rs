[workspace]
resolver = "3"
members = [
    "rust/contract",
    "rust/golden",
    "rust/protoc-gen-contract-rust",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
license = "Apache-2.0"
repository = "https://github.com/sonalect/protoc-gen-contract-rust"
version = "0.0.0"

[workspace.dependencies]
buffa = "=0.9.2"
buffa-codegen = "=0.9.2"
buffa-types = "=0.9.2"
connectrpc = { version = "=0.9.1", default-features = false }
contract = { path = "rust/contract" }
futures-core = "=0.3.34"
heck = "=0.5.0"
prettyplease = "=0.3.0"
proc-macro2 = "=1.0.107"
quote = "=1.0.47"
syn = { version = "=3.0.6", features = ["full"] }
tokio = { version = "=1.53.2", default-features = false }

[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = "symbols"

# Release binaries of the plugin:
#   cargo build --locked --profile dist --target <triple> -p protoc-gen-contract-rust
# The binaries are static per target: the Linux musl targets link
# statically by themselves, the Windows MSVC targets get a static C runtime
# from .cargo/config.toml, and macOS links only the system libraries
# (Apple supports no fully static binary).
[profile.dist]
inherits = "release"
lto = "fat"
